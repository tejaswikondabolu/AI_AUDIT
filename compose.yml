services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-invoice_auditor}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_erp_schema.sql:/docker-entrypoint-initdb.d/01_erp_schema.sql:ro
      - ./database/02_erp_seed.sql:/docker-entrypoint-initdb.d/02_erp_seed.sql:ro
      - ./database/03_audit_schema.sql:/docker-entrypoint-initdb.d/03_audit_schema.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-invoice_user} -d ${POSTGRES_DB:-invoice_auditor}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6339:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/localhost/6333'"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mock-erp:
    build:
      context: .
      dockerfile: docker/mock-erp.Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-invoice_auditor}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "8009:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    env_file:
      - .env
    environment:
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-invoice_auditor}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

      # Qdrant
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-invoice_documents}

      # Mock ERP
      MOCK_ERP_URL: http://mock-erp:8000

      # AWS Bedrock
      AWS_REGION: ${AWS_REGION:-us-east-1}
      #LLM models
      LLM_MODEL: ${LLM_MODEL:-bedrock/amazon.nova-lite-v1:0}
      RAG_MODEL: ${RAG_MODEL:-bedrock/amazon.nova-lite-v1:0}
      TRANSLATION_MODEL: ${TRANSLATION_MODEL:-bedrock/amazon.nova-lite-v1:0}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bedrock/amazon.titan-embed-text-v1}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}

      # LLM settings
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.0}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1000}

      # OCR
      OCR_LANGUAGES: ${OCR_LANGUAGES:-eng+vie}

      # AWS shared credentials/config paths
      #AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      #AWS_CONFIG_FILE: /root/.aws/config
      AWS_SHARED_CREDENTIALS_FILE: /home/appuser/.aws/credentials
      AWS_CONFIG_FILE: /home/appuser/.aws/config
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mock-erp:
        condition: service_healthy
    volumes:
      - ./data/incoming:/app/data/incoming
      - ./outputs/reports:/app/outputs/reports
      #- /home/labuser/.aws:/root/.aws:ro
      - /home/labuser/.aws:/home/appuser/.aws:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    env_file:
      - .env
    environment:
      AGENT_URL: http://agent:8000
      ERP_URL: http://mock-erp:8000
    ports:
      - "8503:8501"
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data: